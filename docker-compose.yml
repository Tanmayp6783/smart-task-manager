services:
  backend:
    build:
      context: ./server
    container_name: smart-task-manager-backend

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: smart-task-manager-frontend

    ports:
      - "4173:4173"

    environment:
      VITE_API_URL: http://backend:5000/api

    depends_on:
      - backend

    restart: unless-stopped